name: Attest release files

# ci/release.sh builds and publishes each release from the maintainer's machine. This workflow builds the release's tag
# again on GitHub's runners, checks that every file it built is byte for byte the one in the release, and only then records
# a signed provenance attestation for those files. Anyone can then check a downloaded file with
#   gh attestation verify main.js --repo chauduyphanvu/obsidian-backtest
# A release file that differs from the build fails the run and gets no attestation.
on:
  release:
    types: [published]
  # To attest a release again, for example after a run that GitHub did not start.
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attest, such as 0.13.1
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: npm ci
      - run: node esbuild.config.mjs

      - name: Compare the build with the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          for f in main.js manifest.json styles.css backtest-blocks.mjs; do
            cmp "dist/$f" "release/$f" || { echo "::error::$f in release $TAG is not the file that tag builds."; exit 1; }
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/backtest-blocks.mjs
