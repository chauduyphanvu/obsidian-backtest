name: Release

# Push a tag that equals the version in manifest.json (for example 0.1.0, with no "v").
# Obsidian reads the release whose tag is that version, so the check below fails the
# run when they differ. The release is created as a draft: publish it by hand.
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The tests run .ts files directly with Node (`node --test tests/*.test.ts`), which
          # needs a Node that strips types without a flag. Node 26 is the version the project is
          # developed with, and it is a long-term-support release.
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check that the tag is the manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but manifest.json says $version." >&2
            exit 1
          fi

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/main.js dist/manifest.json dist/styles.css \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
